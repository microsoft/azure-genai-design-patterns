schema_version: 1
id: hosted-agent-streaming-model-gateway
category: agent-runtime
title: Hosted agent behind a streaming model gateway (bring your own model)
summary: >-
  Solution accelerator for a Foundry hosted agent that calls its model through
  a team-owned, OpenAI-compatible streaming gateway on Azure Container Apps.
  The gateway validates Entra tokens, routes to Foundry deployments or a
  bring-your-own model, keeps server-sent events unbuffered, retries only
  before the first byte, enforces per-caller policy, attributes usage and
  fails closed. Includes Bicep, a pipeline, gateway code, ADRs and an offline
  simulator.
