schema_version: 1
id: hosted-agent-otel-trace-receiver
category: agent-runtime
title: Custom OpenTelemetry export from hosted agents with a lightweight trace receiver
summary: >-
  Sample for exporting a second, team-owned copy of Foundry hosted agent
  OpenTelemetry GenAI traces over OTLP/HTTP, alongside built-in Application
  Insights tracing rather than instead of it. A lightweight receiver
  authenticates exporters with Entra tokens, bounds payloads, redacts by
  allowlist with content off by default, hashes identifiers and returns OTLP
  partial success. Collector-first guidance, ADRs and an offline self-test.
