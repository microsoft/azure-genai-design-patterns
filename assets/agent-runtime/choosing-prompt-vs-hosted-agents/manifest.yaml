id: choosing-prompt-vs-hosted-agents
category: agent-runtime
title: Choosing Prompt Agents vs Hosted Agents in Microsoft Foundry
summary: >-
  A decision pattern for choosing between Foundry prompt agents (declarative
  model, instructions, and platform-managed tools), hosted agents (your own
  containerized Agent Framework, LangGraph, or custom code run by Foundry), or
  a mixed design, per scenario. Covers control, tools and protocols, state,
  identity, network isolation, observability, operations, and migration, with
  a runnable rubric-based runtime selector.
