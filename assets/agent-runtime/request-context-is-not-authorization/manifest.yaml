schema_version: 1
id: request-context-is-not-authorization
category: agent-runtime
title: Request Context Is Not Authorization
summary: >-
  Treat everything in an agent's request context (forwarded headers, payload tenant or user ids, metadata, tool
  arguments, retrieved content, memory, model output) as tainted input. Derive authorization only from a verified
  identity, decide it in a deny-by-default policy decision point, and re-check it at every tool and resource
  boundary at call time. The model is never the policy decision point.
kind: design-pattern
maturity: preview
