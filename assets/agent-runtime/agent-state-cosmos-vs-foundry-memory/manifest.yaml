schema_version: 1
id: agent-state-cosmos-vs-foundry-memory
category: agent-runtime
title: "Agent State and Memory: Private Cosmos DB vs Foundry Memory"
summary: >-
  Separate the three kinds of agent state that teams conflate: resumable thread and checkpoint state, long-term
  user memory, and system-of-record data. Put them behind a pluggable StateStore, MemoryStore and ContextProvider
  interface, derive every key from the verified user and tenant, gate memory writes with a consent and content
  policy, and pick private Cosmos DB, Foundry Memory, a vector store or SQLite per kind of state, with an
  auditable erasure path.
