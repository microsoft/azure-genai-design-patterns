schema_version: 1
id: production-hosted-agents-on-foundry
category: agent-runtime
title: Production Hosted Agents on Microsoft Foundry
summary: >-
  Reference architecture for running containerized hosted agents on Microsoft
  Foundry Agent Service in production, on top of the secured Foundry landing
  zone. Covers private networking, a managed identity with least-privilege
  data-plane roles, CI/CD from a runner inside the VNet, an explicit session
  lifecycle (pin, heartbeat, cleanup), per-audience token caching,
  OpenTelemetry observability and a governed rollout with version pinning and
  rollback, plus ADRs and an offline simulator.
