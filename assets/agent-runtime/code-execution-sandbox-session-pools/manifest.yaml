id: code-execution-sandbox-session-pools
category: agent-runtime
title: Code Execution Sandboxes with Session Pools
summary: >-
  Design pattern for agents that write and run code. Never execute
  model-generated code in the agent's process. Run it in Azure Container Apps
  dynamic sessions (session pools): one isolated session per user and
  conversation, egress off by default, explicit lifecycle, file I/O through the
  session API and a least-privilege executor role. Includes a decision matrix,
  threat model, ADRs and an offline simulator.
