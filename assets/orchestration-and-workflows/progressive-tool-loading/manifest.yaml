schema_version: 1
id: progressive-tool-loading
category: orchestration-and-workflows
title: Progressive Tool and Skill Loading
summary: >-
  Start each run with a small skill index, then disclose tool schemas and skill instructions in tiers
  by phase or on model request. A context budget, deterministic ordering and eviction keep context
  focused. Calls to unloaded tools are rejected and every load is recorded. Loading decides when a tool
  is shown; entitlement and the autonomy profile decide which tools are eligible, and the server still
  checks entitlement on every call.
