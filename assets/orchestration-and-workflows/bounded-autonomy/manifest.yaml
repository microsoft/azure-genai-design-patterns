schema_version: 1
id: bounded-autonomy
category: orchestration-and-workflows
title: "Bounded Autonomy: Budgets, Action Envelopes and Escalation"
summary: >-
  Server-enforced limits that let an agent act on its own inside a known
  envelope and stop or escalate outside it. Server-side policy picks an
  autonomy profile from verified identity, never the prompt. The harness
  enforces attempt, tool-call, token, time and cost budgets, checks each planned
  step against tool, side-effect, argument and data-boundary rules, fails
  closed without policy or audit, and records every decision.
