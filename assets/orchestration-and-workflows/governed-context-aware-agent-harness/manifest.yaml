id: governed-context-aware-agent-harness
category: orchestration-and-workflows
title: Governed Context-Aware Agent Harness
summary: >-
  A reference architecture for the runtime harness around an LLM agent:
  mandatory plan-before-act policy, progressive skill disclosure, scoped
  memory, an independent deterministic verifier, an evidence ledger, separate
  human approval of the exact verified artifact, and a completion certificate
  - so a convincing answer is never mistaken for a correctly completed task.
