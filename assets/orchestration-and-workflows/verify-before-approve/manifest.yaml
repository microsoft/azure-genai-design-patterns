schema_version: 1
id: verify-before-approve
category: orchestration-and-workflows
title: "Verify Before Approve: Deterministic Verification Ahead of Human Approval"
summary: >-
  Separates machine-checkable verification from human approval. A verifier
  independent of the generating model runs deterministic checks; only verified
  artifacts reach approvers, and each approval binds to the exact artifact
  sha256 and verification receipt. Failures drive bounded self-correction, then
  a labelled unverified preview, never silent approval. Approvers spend their
  attention on judgement, not arithmetic, and rubber-stamp approvals drop.
