schema_version: 1
id: evidence-ledger-and-run-certificate
category: orchestration-and-workflows
title: "Evidence Ledger and Run Certificate"
summary: >-
  An append-only, hash-chained evidence ledger that records each agent step
  (policy decisions, tool calls, source digests, checks, approvals) as digests
  and references rather than raw content, sealed by a signed run certificate
  that binds the ledger head, artifact digest, required checks and approval. A
  run is done only with a valid, non-withheld certificate that anyone with a
  trusted key can verify offline.
kind: design-pattern
maturity: preview
