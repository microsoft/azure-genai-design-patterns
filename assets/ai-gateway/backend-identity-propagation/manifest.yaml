schema_version: 1
id: backend-identity-propagation
category: ai-gateway
title: Backend Identity Propagation for MCP and Agent Gateways (OBO, Signed Assertions, Tenant Credentials)
summary: >-
  How an MCP server or agent gateway carries the end user's identity to a
  backend system of record without forwarding the client's token. Compares
  on-behalf-of token exchange (RFC 8693, Entra OBO), a gateway-signed user
  assertion with an identity link over mTLS, and a transitional per-tenant
  credential bridge, plus app-only calls and agent identity. Includes a
  decision matrix, wire contracts, caching and revocation rules, illustrative
  API Management policies, and an offline simulator.
