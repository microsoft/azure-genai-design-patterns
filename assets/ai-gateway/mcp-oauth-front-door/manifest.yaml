schema_version: 1
id: mcp-oauth-front-door
category: ai-gateway
title: MCP OAuth Front Door (Protected Resource Metadata, Discovery and Client Registration Shims)
summary: >-
  An OAuth front door on Azure API Management that lets MCP clients discover
  Microsoft Entra ID or Entra External ID and obtain correctly scoped tokens
  for remote MCP servers. Covers the 401 challenge, Protected Resource Metadata
  (RFC 9728), an RFC 8414 metadata shim, an optional governed registration
  shim, authorize and token facades that map resource to scope, token
  validation, security trade-offs, and an offline simulator.
