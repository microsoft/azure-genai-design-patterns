schema_version: 1
id: multi-team-model-gateway
category: ai-gateway
title: Multi-Team Model Gateway with Per-Team Token Quotas
summary: >-
  A solution accelerator that lets several product teams share one Microsoft
  Foundry model deployment pool behind Azure API Management as an AI gateway.
  Each team gets its own token-per-minute budget, usage attribution for
  chargeback, and a gateway key delivered only through its own Foundry project
  connection, so no team ever holds a model key or can spend another team's
  quota. Includes Bicep, gateway policies, Python client code, and an offline
  simulator.
