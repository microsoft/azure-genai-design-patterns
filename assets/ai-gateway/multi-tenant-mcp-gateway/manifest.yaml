schema_version: 1
id: multi-tenant-mcp-gateway
category: ai-gateway
title: Multi-Tenant MCP Gateway on Azure API Management
summary: >-
  A reference architecture for a SaaS provider (ISV) or platform team that
  exposes many backend APIs as MCP tools to many tenants' agents through one
  governed Azure API Management front door. Covers the WAF network path,
  token-derived tenant identity, a per-call policy pipeline (entitlement,
  per-tenant limits, backend credentials, cell routing, audit), tool checks on
  every tools/call, API Center as the catalog, and a runnable simulator.
