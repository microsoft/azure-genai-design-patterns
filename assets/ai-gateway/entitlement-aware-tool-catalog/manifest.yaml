schema_version: 1
id: entitlement-aware-tool-catalog
category: ai-gateway
title: Entitlement-Aware Tool Catalog
summary: >-
  An MCP gateway that returns from tools/list only the tools each caller's tenant licenses and roles allow,
  with schemas minimized per entitlement, and re-checks the same decision on every tools/call so hidden or
  guessed tool names never run. Entitlements come from the validated token and a registry, views are cached by
  entitlement set rather than by user, and catalog changes reach affected sessions as tools/list_changed.
kind: design-pattern
